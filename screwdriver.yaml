shared:
    image: node:18
    steps:
        - echo: echo test
jobs:
    fail_B_prod:
        requires: [~sd@3031:fail_A]
        annotations:
            screwdriver.cd/virtualJob: true
    fail_B_beta:
        requires: [~sd@4410:fail_A]
        annotations:
            screwdriver.cd/virtualJob: true
    success_B_or_prod:
        requires: [~sd@3031:success_A]
        annotations:
            screwdriver.cd/virtualJob: true
    success_B_or_beta:
        requires: [~sd@4410:success_A]
        annotations:
            screwdriver.cd/virtualJob: true
    success_B_and_prod:
        requires: [sd@3031:success_A]
    success_B_and_beta:
        requires: [sd@4410:success_A]
    or_multiple_B_prod:
        requires: [~sd@3031:success_A, ~sd@3031:fail_A]
        annotations:
            screwdriver.cd/virtualJob: true
    or_multiple_B_beta:
        requires: [~sd@4410:success_A, ~sd@4410:fail_A]
        annotations:
            screwdriver.cd/virtualJob: true
    parallel_B1:
        requires: [~sd@4410:parallel_A, ~sd@3031:parallel_A]
        annotations:
            screwdriver.cd/virtualJob: true
    parallel_B2:
        requires: [~sd@4410:parallel_A, ~sd@3031:parallel_A]
        annotations:
            screwdriver.cd/virtualJob: true
